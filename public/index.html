<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>나를 한 문장으로</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone flow for students; wide projector board for the teacher.
   Color system = the four 요약의 틀 marks: 서술어 red, 중심 서술어 purple, 주어 blue, 꾸밈말 yellow. */
:root{
  --paper:#eff1f4; --card:#ffffff; --ink:#15161b; --muted:#5b6070; --line:#d6d9e1; --soft:#e4e7ee;
  --pred:#d9443a; --core:#6a45e2; --subj:#2d6be0; --mod:#f0bd16; --on-mod:#1d1800;
  --core-tint:#ece6ff; --subj-tint:#e3ecff; --mod-tint:#fff2bf; --pred-tint:#ffe4e1;
  --good:#1e8a50; --bad:#c53a30;
  --stim-bg:#141519; --s-red:#ff5a4e; --s-blue:#4d8dff; --s-green:#38c472; --s-yellow:#ffd43f;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101116; --card:#1a1b22; --ink:#eceef4; --muted:#9a9fae; --line:#2c2e38; --soft:#23252e;
  --pred:#ff6b5f; --core:#9b7dff; --subj:#62a0ff; --mod:#f3c94b; --on-mod:#1d1800;
  --core-tint:#2a2346; --subj-tint:#1c2a45; --mod-tint:#3a3214; --pred-tint:#3d1f1d;
  --good:#45c27c; --bad:#ff6b5f; --stim-bg:#060608; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#101116; --card:#1a1b22; --ink:#eceef4; --muted:#9a9fae; --line:#2c2e38; --soft:#23252e;
  --pred:#ff6b5f; --core:#9b7dff; --subj:#62a0ff; --mod:#f3c94b; --on-mod:#1d1800;
  --core-tint:#2a2346; --subj-tint:#1c2a45; --mod-tint:#3a3214; --pred-tint:#3d1f1d;
  --good:#45c27c; --bad:#ff6b5f; --stim-bg:#060608; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--subj);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1.2}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wide{max-width:1180px}

/* buttons */
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--ink);color:var(--paper);min-height:52px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 0;min-width:0}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--muted);text-decoration:underline;font-size:14px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:20px}
.brand i{font-style:normal;color:var(--core)}
.steps{display:flex;gap:4px}
.steps span{width:22px;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--core)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:24px}
.panel p{margin:0}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:17px;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--subj);outline:none}
.note{font-size:14px;color:var(--muted)}
.teacher-cue{border-left:4px solid var(--subj);background:var(--subj-tint);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}

/* home */
.hero{padding-block:28px 8px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(40px,11vw,64px)}
.hero h1 .p{color:var(--pred)} .hero h1 .c{color:var(--core)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip-static{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
.k-pred{background:var(--pred-tint);color:var(--pred)}
.k-core{background:var(--core-tint);color:var(--core)}
.k-subj{background:var(--subj-tint);color:var(--subj)}
.k-mod{background:var(--mod-tint);color:var(--ink)}

/* stroop */
.stim{background:var(--stim-bg);border-radius:var(--r);min-height:200px;display:grid;place-items:center;font-family:var(--f-display);font-size:64px;user-select:none}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}
.sw{width:18px;height:18px;border-radius:50%;display:inline-block}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--core);transition:width .2s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums}
.big-pct{font-family:var(--f-num);font-size:56px;font-weight:600;color:var(--core);line-height:1}

/* strength */
.slist{display:flex;flex-direction:column;gap:12px}
.sitem{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.sitem.set{border-color:color-mix(in srgb,var(--core) 45%,var(--line))}
.sq{margin:0;font-size:17px;font-weight:600;line-height:1.5}
.srow{display:flex;align-items:center;gap:12px}
.srow input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--core);height:32px}
.sitem:not(.set) input[type=range]{opacity:.45}
.sval{font-size:24px;font-weight:600;min-width:1.4ch;text-align:center;color:var(--core)}
.sitem:not(.set) .sval{color:var(--muted)}
.sticks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sticks button{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-family:var(--f-num)}
.sticks button.on{background:var(--core);border-color:var(--core);color:#fff}
.slab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:112px 1fr 32px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--muted)}
.bar.top .track i{background:var(--core)}
.bar.top span:first-child{font-weight:700}

/* frame passage */
.passage{font-size:19px;line-height:2.1}
.tok{display:inline;border:0;background:none;padding:2px 3px;margin:0 1px;border-radius:6px;font-size:inherit;line-height:inherit}
button.tok:hover{background:var(--soft)}
.tok.pick{color:var(--pred);font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.tok.ok{color:var(--pred);font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.tok.miss{color:var(--pred);text-decoration:underline dashed;text-underline-offset:5px}
.tok.wrong{color:var(--muted);text-decoration:line-through}
.tok.subj{background:var(--subj-tint);color:var(--subj);font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;text-align:left;font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.no{border-color:var(--bad);opacity:.75}
.opt small{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.opt{flex-wrap:wrap}
.feedback{font-size:15px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.feedback b{color:var(--good)}
.mark{padding:1px 6px;border-radius:6px;font-weight:700;white-space:nowrap}
.m-core{background:var(--core-tint);color:var(--core)}
.m-subj{background:var(--subj-tint);color:var(--subj)}
.m-mod{background:var(--mod);color:var(--on-mod)}
.m-pred{color:var(--pred);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.summary-line{font-size:22px;font-weight:700;line-height:1.8}

/* strength card */
.scard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.scard .row{align-items:baseline}
.sname{font-size:18px;color:var(--core)}
.canlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:17px;font-weight:600}
.uses{display:flex;flex-direction:column;gap:6px}
/* three tests */
.tests{border:1.5px solid var(--core);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--core-tint)}
.tests div{font-size:15px}
.tests b{color:var(--core);margin-right:4px}
.tgrid3{width:100%;border-collapse:collapse;font-size:15px}
.tgrid3 th,.tgrid3 td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
.tgrid3 th:first-child,.tgrid3 td:first-child{text-align:left;font-weight:700}
.tgrid3 .y{color:var(--good);font-weight:700}
.tgrid3 .n{color:var(--muted)}
.tgrid3 tr.win td{background:var(--core-tint)}
/* self builder */
.slot-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600}
.chip.s-mod.on{background:var(--mod);border-color:var(--mod);color:var(--on-mod)}
.chip.s-subj.on{background:var(--subj);border-color:var(--subj);color:#fff}
.chip.s-core.on{background:var(--core);border-color:var(--core);color:#fff}
.formula{font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.preview{font-size:21px;font-weight:700;line-height:1.7;background:var(--paper);border-radius:12px;padding:14px}
.cmp{display:grid;gap:10px}
.cmp .box{border:1px solid var(--line);border-radius:12px;padding:14px}
.cmp .box.now{border:2px solid var(--core)}
.cmp .box p{font-size:18px;font-weight:600}

/* result card */
.rcard{background:var(--ink);color:var(--paper);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}
.rcard .label{color:color-mix(in srgb,var(--paper) 60%,transparent)}
.rcard .final{font-size:24px;font-weight:700;line-height:1.6}
.rcard .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.rcard .meta b{display:block;font-size:18px}

/* ---------- teacher ---------- */
.tbar{display:flex;gap:6px;flex-wrap:wrap}
.tbar button{flex:1 1 120px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;text-align:left;font-size:13px;line-height:1.3;min-width:0}
.tbar button b{display:block;font-size:15px}
.tbar button.on{border-color:var(--core);background:var(--core-tint)}
.tbar button.done{opacity:.6}
.tgrid{display:flex;flex-direction:column;gap:14px}
.tnav{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.tnavbtns{flex:0 1 520px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;gap:20px;min-width:0}
.stage .kicker{font-size:14px;font-weight:700;color:var(--core);letter-spacing:.06em}
.stage h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,4.6vw,60px);line-height:1.2}
.stage .say{font-size:clamp(18px,2vw,24px);line-height:1.6;margin:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.timer{background:var(--ink);color:var(--paper);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.timer .t{font-family:var(--f-num);font-size:clamp(48px,6vw,72px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.timer .t.over{color:var(--s-red)}
.timer .btn{background:var(--paper);color:var(--ink)}
.timer .btn.ghost{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 35%,transparent)}
.script{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.script ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tally{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(80px,180px) 1fr auto;gap:12px;align-items:center}
.trow .name{font-weight:700;font-size:clamp(15px,1.6vw,20px)}
.trow .track{height:clamp(22px,2.6vw,34px);background:var(--soft);border-radius:8px;overflow:hidden;position:relative}
.trow .track i{position:absolute;inset:0 auto 0 0;background:var(--core);border-radius:8px;transition:width .25s}
.trow .ctl{display:flex;align-items:center;gap:6px}
.trow .ctl button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:700;line-height:1}
.trow .ctl b{font-family:var(--f-num);font-size:22px;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.tbig{font-size:clamp(20px,2.4vw,30px);line-height:2;font-weight:600}
.reveal-steps{display:flex;flex-wrap:wrap;gap:8px}
.reveal-steps button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.reveal-steps button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cards{display:flex;flex-wrap:wrap;gap:10px}
.cardlet{border-radius:12px;padding:10px 16px;font-size:clamp(17px,2vw,24px);font-weight:700}
.linkshow{font-family:var(--f-num);font-size:clamp(18px,2.4vw,30px);word-break:break-all;background:var(--paper);border-radius:12px;padding:14px}
.subtabs{display:flex;gap:6px}
.subtabs button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.subtabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ivisual{display:flex;flex-direction:column;gap:18px}
.vgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.vgrid{grid-template-columns:1fr}}
.vcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.flow{display:flex;flex-wrap:nowrap;align-items:stretch;gap:6px}
@media (max-width:640px){.flow{flex-wrap:wrap}.fstep{min-width:96px}}
.fstep{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:var(--paper)}
.fstep b{font-size:clamp(16px,1.7vw,21px)}
.fstep span{font-size:clamp(13px,1.3vw,15px);color:var(--muted)}
.fstep.hot{background:var(--ink);border-color:var(--ink)}.fstep.hot b,.fstep.hot span{color:var(--paper)}
.fstep.s-p{border-color:var(--pred)}.fstep.s-p b{color:var(--pred)}
.fstep.s-c{border-color:var(--core);background:var(--core-tint)}.fstep.s-c b{color:var(--core)}
.fstep.s-s{border-color:var(--subj);background:var(--subj-tint)}.fstep.s-s b{color:var(--subj)}
.fstep.s-m{border-color:var(--mod);background:var(--mod-tint)}
.farrow{align-self:center;color:var(--muted);font-size:20px;font-weight:700}
@media (max-width:640px){.farrow{display:none}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.vcard{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line)}
.vcard>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.vcard p{margin:0;font-size:clamp(17px,1.8vw,22px);font-weight:700;line-height:1.6}
.vcard small{font-size:clamp(13px,1.3vw,15px);color:var(--muted)}
.vcard.bad{background:var(--soft)}.vcard.bad p{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.vcard.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--card))}
.vmark{font-size:28px;font-weight:700;line-height:1}
.vcard.bad .vmark{color:var(--bad)}.vcard.good .vmark{color:var(--good)}
.rounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcardx{background:var(--stim-bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rcardx .label{color:#b9bcc8}
.rword{font-family:var(--f-display);font-size:clamp(34px,4vw,48px);line-height:1.2}
.rcardx b{color:#fff;font-size:18px}.rcardx b.slowb{color:var(--s-red)}
.keyline{margin:0;font-size:clamp(17px,1.8vw,22px);line-height:1.6;text-align:center}
.keyline b{color:var(--core)}
.cchart{margin:0;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.cchart figcaption{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:700;font-size:clamp(15px,1.5vw,18px)}
.cchart figcaption .label{width:100%}
.cbar{display:grid;grid-template-columns:minmax(84px,128px) 1fr 2.4ch;gap:8px;align-items:center;font-size:clamp(14px,1.4vw,17px)}
.ctrack{height:clamp(14px,1.6vw,20px);background:var(--soft);border-radius:6px;overflow:hidden}
.ctrack i{display:block;height:100%;background:var(--muted);border-radius:6px}
.cbar.top span:first-child{font-weight:700}.cbar.top .ctrack i{background:var(--core)}
.cbar b{text-align:right}
.keybox{display:flex;align-items:center;gap:14px;border-left:4px solid var(--core);padding:6px 0 6px 14px}
.kbig{font-family:var(--f-display);font-size:clamp(24px,2.6vw,34px);color:var(--core);min-width:3.3em;line-height:1.1;white-space:nowrap}
.keybox span:last-child{font-size:clamp(15px,1.6vw,19px);line-height:1.5}
.usehead{margin-top:4px}
.usegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.usegrid{grid-template-columns:1fr}}
.utile{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.utile b{font-size:clamp(16px,1.7vw,20px)}
.utile span{font-size:clamp(14px,1.45vw,17px);color:var(--muted);line-height:1.5}

function strengthCard(a){
  return `<div class="scard"><div class="row" style="justify-content:space-between"><b class="sname">${a.name}</b><span class="note">${a.how}</span></div>
  <ul class="canlist">${a.can.map(c=>`<li><span class="m-pred">${c}</span></li>`).join('')}</ul>
  <div class="uses"><span class="label">이런 일에서 쓰여요</span><div class="chips">${a.uses.map(u=>`<span class="chip-static k-subj">${u}</span>`).join('')}</div></div></div>`;
}
function slot(color,title,list,key,ckey,ph){
  return `<div class="slot-title"><span class="chip-static k-${color}" style="padding:2px 8px">${color==='core'?'보라':'노랑'}</span>${title}</div>
  <div class="chips">${list.map(v=>`<button class="chip s-${color} ${S[key]===v?'on':''}" data-slot="${key}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>
  <input type="text" id="in-${key}" maxlength="30" placeholder="${ph}" value="${esc(S[ckey])}">`;
}
function selfText(){
  if(S.edited)return S.text;
  const adj=(S.cAdj.trim()||S.adj),mod=(S.cMod.trim()||S.mod),verb=(S.cVerb.trim()||S.verb);
  if(!verb)return '';
  return [adj,'나는',mod,verb].filter(Boolean).join(' ').replace(/\.?$/,'.');
}

function passageHTML(mode){
  return TOK.map(ws=>ws.map(t=>{
    let c='';
    if(mode==='pick'){c=S.pick.includes(t.id)?'pick':'';return `<button class="tok ${c}" data-tok="${t.id}">${t.w}</button>`}
    if(mode==='check'){const isP=PRED_IDS.includes(t.id),on=S.pick.includes(t.id);c=isP?(on?'ok':'miss'):(on?'wrong':'')}
    if(mode==='pred'){c=PRED_IDS.includes(t.id)?'ok':''}
    if(mode==='done'){c=PRED_IDS.includes(t.id)?'ok':'';if(SUBJ_IDS.includes(t.id))c+=' subj'}
    return `<span class="tok ${c}">${t.w}</span>`}).join(' ')).join(' ');
}
function mcScreen(step,Q,key){
  const v=S[key],done=v!==null;
  return `<div class="panel"><span class="label">4 · 요약의 틀 · ${step}</span><h2>${Q.q}</h2>
  <div class="passage" style="font-size:17px">${passageHTML(key==='f3'&&done?'done':'pred')}</div>
  <div class="opts">${Q.opts.map((o,i)=>{let c='';if(done){c=i===Q.ans?'right':(i===v?'no':'')}
    return `<button class="opt ${c}" data-mc="${i}" ${done?'disabled':''}><span>${o}</span>${done&&i===Q.ans?'<small>정답</small>':''}</button>`}).join('')}</div>
  ${done?`<div class="feedback">${v===Q.ans?'<b>맞았어요.</b> ':''}${Q.why}</div><button class="btn" id="nx">다음 단계로</button>`:''}</div>`;
}

/* 계산 */
function avg(r){const c=r.filter(x=>x.ok);const a=(c.length?c:r);if(!a.length)return 0;return Math.round(a.reduce((s,x)=>s+x.rt,0)/a.length)}
function sec(ms){return (ms/1000).toFixed(2)+'초'}
function sec1(ms){return (ms/1000).toFixed(1)+'초'}
function correct(r){return r.filter(x=>x.ok).length}
function slow(){const a=avg(S.r1),b=avg(S.r2);if(!a)return 0;return Math.round((b-a)/a*100)}
function areaStat(k){let s=0,c5=0,c4=0;ITEMS.forEach((it,i)=>{if(it[0]!==k)return;const v=+(S.ans[i]||0);s+=v;if(v===5)c5++;if(v===4)c4++});return {s,c5,c4}}
function ranked(){return AREAS.map(a=>{const t=areaStat(a.k);return {k:a.k,name:a.name,score:t.s,rank:t.s*100+t.c5*10+t.c4}}).sort((x,y)=>y.rank-x.rank)}
function topTwo(){const r=ranked();return r.slice(0,2).map(x=>AREAS.find(a=>a.k===x.k))}

/* 색깔 실험 진행 */
let SR=null;
function stopStroop(){if(SR&&SR.to)clearTimeout(SR.to);SR=null}
function stroopScreen(round){
  return `<div class="panel"><span class="label">2 · 색깔 실험 · ${round}라운드 ${round===1?'· 글자=색':'· 글자≠색'}</span>
  <div class="row" style="justify-content:space-between"><div class="meter" style="flex:1"><i id="sm" style="width:0%"></i></div><span class="clock num" id="clk">0.0초</span></div>
  <div class="stim" id="stim"><span class="muted" style="font-family:var(--f-body);font-size:18px">준비…</span></div>
  <div class="answers">${COLORS.map(c=>`<button data-c="${c.k}"><span class="sw" style="background:var(${c.v})"></span>${c.name}</button>`).join('')}</div>
  <p class="note">칠해진 색을 누르세요.</p></div>`;
}
function startStroop(round){
  stopStroop();
  const list=[];
  for(let i=0;i<TRIALS;i++){
    const ink=COLORS[i%4];let word=ink;
    if(round===2){const others=COLORS.filter(c=>c.k!==ink.k);word=others[Math.floor(Math.random()*3)]}
    list.push({ink,word});
  }
  list.sort(()=>Math.random()-.5);
  SR={round,list,i:0,res:[],t0:0,live:false,to:null,start:null,end:null};
  SR.to=setTimeout(nextTrial,700);
}
function nextTrial(){
  if(!SR)return;const stim=$('#stim');if(!stim)return;
  if(SR.i>=SR.list.length){
    const total=Math.round((SR.end||performance.now())-SR.start);
    if(SR.round===1){S.r1=SR.res;S.t1=total;stopStroop();go('stroopMid')}else{S.r2=SR.res;S.t2=total;stopStroop();go('stroopResult')}
    return;
  }
  const t=SR.list[SR.i];
  stim.innerHTML=`<span style="color:var(${t.ink.v})">${t.word.name}</span>`;
  SR.t0=performance.now();SR.live=true;
  if(SR.start==null){SR.start=SR.t0;requestAnimationFrame(tickClock)}
}
function tickClock(){
  if(!SR||SR.start==null)return;
  const el=$('#clk');if(el)el.textContent=(((SR.end||performance.now())-SR.start)/1000).toFixed(1)+'초';
  if(!SR.end)requestAnimationFrame(tickClock);
}
function answerStroop(k){
  if(!SR||!SR.live)return;SR.live=false;
  const t=SR.list[SR.i],rt=Math.round(performance.now()-SR.t0);
  SR.res.push({rt,ok:k===t.ink.k});SR.i++;
  if(SR.i>=SR.list.length)SR.end=performance.now();
  const m=$('#sm');if(m)m.style.width=(SR.i/SR.list.length*100)+'%';
  const stim=$('#stim');if(stim)stim.innerHTML='';
  SR.to=setTimeout(nextTrial,280);
}

    }

      ${show?`<div class="cards"><span class="cardlet m-core">늘었다</span><span class="cardlet m-subj">편집 실력이</span></div><p class="say lnote">중심 서술어 「늘었다」에서 거꾸로 올라가 「무엇이?」를 물으면 「편집 실력이」예요. 「지수의」는 누구의 실력인지 알려 주는 꾸밈말이라 4단계에서 골라요.</p>`:''}`}
    if(r===4){h+=`<p class="say lnote" style="margin:0">언제·어디서·어떻게·무엇을·왜 등에 답하는 말 가운데, 문단 전체의 맥락을 정확히 담는 꾸밈말을 골라요.</p>
      <div class="lopts">${F4.opts.map((o,k)=>`<span class="lopt ${show&&F4.ans.includes(k)?'right':''}">${o[0]} <small>${o[1]}</small></span>`).join('')}</div>
      ${show?`<div class="cards"><span class="cardlet m-mod">1학년부터 3학년까지</span><span class="cardlet m-mod">축제 영상을 만들면서</span><span class="cardlet m-mod">지수의</span></div><p class="say lnote">「그사이」가 가리키는 1학년부터 3학년까지와 「축제 영상을 만들면서」를 1·3문장에서 가져와요. 4문장만 옮기면 요약이 되지 않아요. 「자막 하나를 넣는 데」「하루 만에」는 한 장면만 말하고, 「몰라보게」는 빼도 뜻이 그대로예요.</p>`:''}`}
    if(r===5){h+=show?`<p class="summary-line" style="font-size:clamp(24px,3vw,38px)"><span class="mark m-mod">1학년부터 3학년까지</span> <span class="mark m-mod">축제 영상을 만들면서</span> <span class="mark m-mod">지수의</span> <span class="mark m-subj">편집 실력이</span> <span class="mark m-core">늘었다</span>.</p><p class="say lnote">고른 말을 이어 붙이면 요약문이 돼요. 순서는 언제나 서술어 → 중심 서술어 → 주어 → 꾸밈말이에요.</p>`
      :`<p class="tbig" style="margin:0"><span class="mark m-mod">꾸밈말</span> + <span class="mark m-subj">주어</span> + <span class="mark m-core">중심 서술어</span></p>`}
    if(r!==2&&r!==0)h+=`<div class="row"><button class="btn" id="showAns">${show?'정답 가리기':'정답 보기'}</button></div>`;
  }
  if(i===5){h+=`<p class="tbig" style="margin:0"><span class="mark m-mod">어떤</span> <span class="mark m-subj">나는</span> <span class="mark m-mod">어떻게</span> <span class="mark m-core">무엇을 한다</span></p>
    <p class="say muted">예) <span class="mark m-mod">눈으로 먼저 생각하는</span> <span class="mark m-subj">나는</span> <span class="mark m-mod">사람들이 쉽게 쓰도록</span> <span class="mark m-core">화면을 보기 좋게 배치한다</span>.</p>
    <p class="say">중심 서술어를 먼저 정하세요. 강점 결과의 「잘할 수 있는 일」 가운데 나머지를 다 품는 하나를 고르면 돼요. 나머지는 그다음이에요.</p>`}
  if(i===4&&ONLINE)h+=frameStats();
  if(i===5&&ONLINE)h+=wallHTML();
  if(P.tally)h+=tallyHTML(P.tally);
  if(i===6&&ONLINE)h+=wallHTML();
  return h;
}
function tick(){
  if(!T.run)return;T.left--;saveT();const el=$('#tt');if(el){el.textContent=fmt(T.left);el.classList.toggle('over',T.left<0)}
}
function setPhase(i){T.phase=i;T.sub=0;T.spot='';T.show=false;T.left=phaseSecs(i);T.run=false;T.reveal=0;saveT();render();window.scrollTo(0,0)}
function bindTeacher(){
  $('#toHome').onclick=()=>{T.run=false;saveT();S.mode='';saveS();render()};
  document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>setPhase(+b.dataset.ph));
  $('#prev').onclick=goPrev;
  $('#next').onclick=goNext;
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{T.sub=+b.dataset.sub;saveT();render()});
  const el=$('#tt');if(el)el.classList.toggle('over',T.left<0);
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const a=T[b.dataset.t],i=+b.dataset.i;a[i]=Math.max(0,a[i]+(+b.dataset.d));saveT();render()});
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{T.reveal=+b.dataset.rv;T.show=false;saveT();render()});
  const sa=$('#showAns');if(sa)sa.onclick=()=>{T.show=!T.show;saveT();render()};
  document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{const c=T.cells||[],id=b.dataset.cell;T.cells=c.includes(id)?c.filter(x=>x!==id):[...c,id];saveT();render()});
  const ca=$('#cellsAll');if(ca)ca.onclick=()=>{const all=[];F2.opts.forEach((o,k)=>[0,1,2].forEach(c=>all.push(k+'-'+c)));T.cells=(T.cells||[]).length<all.length?all:[];saveT();render()};
  const lk=$('#lk');if(lk)lk.onchange=()=>{T.link=lk.value;saveT();render()};
  $('#resetT').onclick=()=>{
    $('#tresetBox').innerHTML=`<span class="confirm">${ONLINE?'이 반 학생 결과가 서버에서 지워져요.':'집계와 링크가 지워져요.'} <button class="btn small" id="ry">지우기</button><button class="btn small ghost" id="rn">취소</button></span>`;
    $('#ry').onclick=async()=>{const room=T.room;if(ONLINE&&CODE_RE.test(room)){try{await fetch('/api/room/'+room,{method:'DELETE'})}catch(e){}}ROSTER=[];T=freshT();T.room=room;saveT();render()};$('#rn').onclick=()=>render();
  };
  document.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>{T.spot=T.spot===b.dataset.spot?'':b.dataset.spot;saveT();render();window.scrollTo({top:0,behavior:'smooth'})});
  const sc=$('#spotClose');if(sc)sc.onclick=()=>{T.spot='';saveT();render()};
  const it=$('#indivToggle');if(it)it.onclick=()=>{T.indiv=!T.indiv;saveT();render()};
  const dl=$('#csvDl');if(dl)dl.onclick=downloadCSV;
  const nr=$('#newRoom');if(nr)nr.onclick=()=>{
    $('#newRoomBox').innerHTML=`<span class="confirm">새 반 코드를 만들고 집계를 0부터 시작해요. 지금 반 결과는 서버에서 지워져요. <button class="btn small" id="nry">새 반 시작</button><button class="btn small ghost" id="nrn">취소</button></span>`;
    $('#nry').onclick=async()=>{const old=T.room;try{await fetch('/api/room/'+old,{method:'DELETE'})}catch(e){}ROSTER=[];T=freshT();T.room=newCode();saveT();render();poll()};
    $('#nrn').onclick=()=>render();
  };
}
document.addEventListener('keydown',e=>{
  if(S.mode!=='t'||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;
  if(e.key==='ArrowRight')goNext();
  if(e.key==='ArrowLeft')goPrev();
});

/* ===================== 전체 기록 내려받기 (CSV, 엑셀에서 열림) ===================== */
const STEP_NAME={1:'처음 한 문장',2:'색깔 실험',3:'강점 찾기',4:'요약의 틀',5:'나를 요약하기',6:'비교'};
function downloadCSV(){
  const q=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const s1=ms=>ms==null?'':(ms/1000).toFixed(1), s2=ms=>ms==null?'':(ms/1000).toFixed(2);
  const area=k=>{const a=AREAS.find(x=>x.k===k);return a?a.name:''};
  const head=['닉네임','처음 쓴 문장','1라운드 걸린 시간(초)','1라운드 오답(개)','2라운드 걸린 시간(초)','2라운드 오답(개)','1라운드 문제당(초)','2라운드 문제당(초)','느려진 비율(%)',
    '1위 강점','2위 강점',...AREAS.map(a=>a.name+'(25점)'),'1단계 맞힌 서술어(4개 중)','2단계 고른 중심 서술어','3단계 고른 주어','4단계 고른 꾸밈말','요약의 틀로 쓴 문장','비교 선택','진행한 단계'];
  const rows=ROSTER.map(s=>[s.name,s.first,s1(s.t1),s.w1??'',s1(s.t2),s.w2??'',s2(s.r1),s2(s.r2),s.slow==null?'':Math.round(s.slow),
    area((s.top||[])[0]),area((s.top||[])[1]),...AREAS.map((a,i)=>(s.top||[]).length?((s.scores||[])[i]??''):''),
    s.f1hit??'',s.f2==null?'':F2.opts[s.f2],s.f3==null?'':F3.opts[s.f3],(s.f4||[]).map(i=>F4.opts[i]?F4.opts[i][0]:'').join(' / '),
    s.selfDone?s.self:'',s.cmp==null?'':CMP[s.cmp],s.screen==='card'?'결과 카드까지 마침':(STEP_NAME[PHASE_OF[s.screen]]||'')]);
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const name=`나한문장_${T.room}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ===================== 진행자 자동 집계 ===================== */
let lastRoster='';
async function poll(){
  if(!ONLINE||S.mode!=='t'||!CODE_RE.test(T.room||''))return;
  try{const r=await fetch('/api/room/'+T.room,{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    const str=JSON.stringify(j.students||[]);if(str===lastRoster)return;lastRoster=str;
    ROSTER=(j.students||[]).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
    if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;
    if(S.mode==='t')renderTeacher();
  }catch(e){}
}
function startPolling(){if(ONLINE&&!PI){PI=setInterval(poll,3000)}poll()}

/* ===================== 시작 ===================== */
function render(){
  if(S.mode==='s'){if(S.screen==='stroop1'||S.screen==='stroop2'){/* 라운드 중 새로고침 → 그 라운드 처음부터 */}renderStudent()}
  else if(S.mode==='t'){T.run=T.run&&true;renderTeacher();if(!TI)TI=setInterval(tick,1000)}
  else renderHome();
}
T.run=false;
render();
(async()=>{try{const r=await fetch('/api/ping',{cache:'no-store'});ONLINE=r.ok&&(await r.json()).ok===true}catch(e){ONLINE=false}
  if(ONLINE){render();if(S.mode==='t')startPolling();if(S.mode==='s')syncNow()}})();
</script>
